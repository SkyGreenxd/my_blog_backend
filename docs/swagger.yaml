basePath: /v1
definitions:
  delivery.ArticleRes:
    properties:
      articleId:
        type: integer
      author:
        $ref: '#/definitions/delivery.UserRes'
      category:
        $ref: '#/definitions/delivery.CategoryRes'
      content:
        type: string
      title:
        type: string
    type: object
  delivery.CategoryRes:
    properties:
      category_id:
        type: integer
      category_name:
        type: string
      category_slug:
        type: string
    type: object
  delivery.ChangePasswordReq:
    properties:
      new_password:
        maxLength: 128
        minLength: 8
        type: string
      old_password:
        maxLength: 128
        minLength: 8
        type: string
    required:
    - new_password
    - old_password
    type: object
  delivery.CreateArticleReq:
    properties:
      category_slug:
        maxLength: 128
        minLength: 3
        type: string
      content:
        maxLength: 16000
        minLength: 10
        type: string
      title:
        maxLength: 100
        minLength: 3
        type: string
    required:
    - category_slug
    - content
    - title
    type: object
  delivery.CreateArticleRes:
    properties:
      article_id:
        type: integer
      category_name:
        type: string
      category_slug:
        type: string
      content:
        type: string
      title:
        type: string
    type: object
  delivery.CreateCategoryReq:
    properties:
      category_name:
        maxLength: 128
        minLength: 3
        type: string
      category_slug:
        maxLength: 128
        minLength: 3
        type: string
    required:
    - category_name
    - category_slug
    type: object
  delivery.CreateUserRequest:
    properties:
      email:
        maxLength: 320
        minLength: 3
        type: string
      password:
        maxLength: 128
        minLength: 8
        type: string
      username:
        maxLength: 32
        minLength: 5
        type: string
    required:
    - email
    - password
    - username
    type: object
  delivery.ErrResponse:
    properties:
      errCode:
        type: string
      errMsg:
        type: string
    type: object
  delivery.GetArticlesByUserRes:
    properties:
      articles:
        items:
          $ref: '#/definitions/delivery.ArticleRes'
        type: array
    type: object
  delivery.LoginRequest:
    properties:
      email:
        maxLength: 320
        minLength: 3
        type: string
      password:
        maxLength: 128
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  delivery.LoginUserRes:
    properties:
      access_token:
        type: string
      access_token_expires_at:
        type: string
      refresh_token:
        type: string
      refresh_token_expires_at:
        type: string
      session_id:
        type: string
      user:
        $ref: '#/definitions/delivery.UserRes'
    type: object
  delivery.LogoutUserReq:
    properties:
      refresh_token:
        type: string
    type: object
  delivery.RefreshTokenReq:
    properties:
      refresh_token:
        type: string
    type: object
  delivery.UpdateArticleReq:
    properties:
      category_slug:
        maxLength: 128
        minLength: 3
        type: string
      content:
        maxLength: 16000
        minLength: 10
        type: string
      title:
        maxLength: 100
        minLength: 3
        type: string
    type: object
  delivery.UpdateArticleRes:
    properties:
      article_id:
        type: integer
      author_id:
        type: integer
      category:
        $ref: '#/definitions/delivery.CategoryRes'
      content:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  delivery.UpdateCategoryReq:
    properties:
      new_category_name:
        maxLength: 128
        minLength: 3
        type: string
      new_category_slug:
        maxLength: 128
        minLength: 3
        type: string
    type: object
  delivery.UpdateUserReq:
    properties:
      email:
        maxLength: 32
        minLength: 3
        type: string
      username:
        maxLength: 32
        minLength: 5
        type: string
    type: object
  delivery.UserRes:
    properties:
      email:
        type: string
      id:
        type: integer
      role:
        $ref: '#/definitions/domain.Role'
      username:
        type: string
    type: object
  domain.Role:
    enum:
    - admin
    - user
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleUser
host: localhost:8080
info:
  contact: {}
  description: API сервис для ведения блога.
  title: My Blog API
  version: "1.0"
paths:
  /articles:
    get:
      consumes:
      - application/json
      description: Get a list of all blog articles
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/delivery.GetArticlesByUserRes'
      summary: Get All Articles
      tags:
      - articles
    post:
      consumes:
      - application/json
      description: Create a new blog article
      parameters:
      - description: Article data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/delivery.CreateArticleReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/delivery.CreateArticleRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
      summary: Create Article
      tags:
      - articles
  /articles/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a blog article
      parameters:
      - description: Article ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete Article
      tags:
      - articles
    get:
      consumes:
      - application/json
      description: Get a single article by its ID
      parameters:
      - description: Article ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/delivery.ArticleRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
      summary: Get Article By ID
      tags:
      - articles
    patch:
      consumes:
      - application/json
      description: Update an existing blog article
      parameters:
      - description: Article ID
        in: path
        name: id
        required: true
        type: integer
      - description: New article data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/delivery.UpdateArticleReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/delivery.UpdateArticleRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
      summary: Update Article
      tags:
      - articles
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidate current session
      parameters:
      - description: Refresh token to invalidate
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/delivery.LogoutUserReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
      summary: Logout
      tags:
      - auth
  /auth/password/change:
    post:
      consumes:
      - application/json
      description: Change current user's password
      parameters:
      - description: Password change data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/delivery.ChangePasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
      security:
      - ApiKeyAuth: []
      summary: Change Password
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Obtain a new access token using a refresh token
      parameters:
      - description: Refresh token
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/delivery.RefreshTokenReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/delivery.LoginUserRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
      summary: Refresh Session
      tags:
      - auth
  /auth/sign-in:
    post:
      consumes:
      - application/json
      description: Log in to an existing account
      parameters:
      - description: Login data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/delivery.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/delivery.LoginUserRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
      summary: Sign In
      tags:
      - auth
  /auth/sign-up:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: Sign up data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/delivery.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/delivery.UserRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
      summary: Sign Up
      tags:
      - auth
  /categories:
    get:
      consumes:
      - application/json
      description: Get a list of all categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get All Categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Create a new category (Admin only)
      parameters:
      - description: Category data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/delivery.CreateCategoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
      summary: Create Category
      tags:
      - categories
  /categories/{slug}:
    delete:
      consumes:
      - application/json
      description: Delete a category by its slug (Admin only)
      parameters:
      - description: Category Slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
      summary: Delete Category
      tags:
      - categories
    patch:
      consumes:
      - application/json
      description: Update an existing category (Admin only)
      parameters:
      - description: Category Slug
        in: path
        name: slug
        required: true
        type: string
      - description: New category data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/delivery.UpdateCategoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
      summary: Update Category
      tags:
      - categories
  /categories/{slug}/articles:
    get:
      consumes:
      - application/json
      description: Get all articles in a specific category
      parameters:
      - description: Category Slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/delivery.GetArticlesByUserRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
      summary: Get Articles By Category
      tags:
      - articles
  /users/{username}:
    get:
      consumes:
      - application/json
      description: Find user by their username
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/delivery.UserRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
      summary: Get User By Username
      tags:
      - users
  /users/{username}/articles:
    get:
      consumes:
      - application/json
      description: Get all articles written by a specific user
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/delivery.GetArticlesByUserRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
      summary: Get Articles By Username
      tags:
      - articles
  /users/me:
    get:
      consumes:
      - application/json
      description: Get data of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/delivery.UserRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
      security:
      - ApiKeyAuth: []
      summary: Get Current User
      tags:
      - users
  /users/me/articles:
    get:
      consumes:
      - application/json
      description: Get all articles written by the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/delivery.GetArticlesByUserRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
      summary: Get My Articles
      tags:
      - articles
  /users/me/update:
    patch:
      consumes:
      - application/json
      description: Update current user's profile information
      parameters:
      - description: New user data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/delivery.UpdateUserReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/delivery.UserRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/delivery.ErrResponse'
      security:
      - ApiKeyAuth: []
      summary: Update User
      tags:
      - users
swagger: "2.0"
